<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E5 AI Coach</title>
<style>
  :root{--bg:#0e1628;--panel:#1c2333;--gold:#f5b942;--text:#f5f9fc;--muted:#8a94a6;--user:#2563eb;--coach:#233047;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
  body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}
  header{background:var(--panel);padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--gold);flex-wrap:wrap;}
  header h1{font-size:17px;letter-spacing:.5px;}
  #coachSelect{background:#0e1628;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:5px 12px;font-size:12px;outline:none;cursor:pointer;}
  .langBtn{background:none;border:1px solid #33405a;color:var(--muted);border-radius:12px;padding:3px 9px;font-size:11px;cursor:pointer;}
  header .tag{margin-left:auto;font-size:11px;color:var(--gold);border:1px solid var(--gold);padding:3px 8px;border-radius:20px;}
  #onboarding{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--panel);border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4);}
  .card h2{color:var(--gold);margin-bottom:6px;}
  .card p{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .card label{font-size:12px;color:var(--muted);display:block;margin:12px 0 6px;}
  .card input{width:100%;padding:12px;border-radius:10px;border:1px solid #33405a;background:#0e1628;color:var(--text);font-size:14px;outline:none;}
  .card input:focus{border-color:var(--gold);}
  .card button{width:100%;margin-top:20px;padding:13px;border:none;border-radius:10px;background:var(--gold);color:#10131a;font-weight:700;font-size:15px;cursor:pointer;}
  #chatScreen{flex:1;display:none;flex-direction:column;height:100%;}
  #messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:82%;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.55;}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px;}
  .msg.coach{align-self:flex-start;background:var(--coach);border:1px solid #2e3b55;border-bottom-left-radius:4px;}
  .msg.coach strong{color:var(--gold);}
  .tts-btn{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13px;margin-top:8px;padding:0;opacity:.85;}
  .tts-btn:hover{opacity:1;}
  #inputBar{display:flex;gap:10px;padding:14px;background:var(--panel);border-top:1px solid #2e3b55;}
  #userInput{flex:1;padding:13px;border-radius:12px;border:1px solid #33405a;background:#0e1628;color:var(--text);font-size:14px;outline:none;}
  #userInput:focus{border-color:var(--gold);}
  #micBtn{padding:0 16px;border:none;border-radius:12px;background:#233047;border:1px solid #33405a;font-size:16px;cursor:pointer;}
  #micBtn.rec{background:#dc2626;border-color:#dc2626;}
  #sendBtn{padding:0 22px;border:none;border-radius:12px;background:var(--gold);font-weight:700;cursor:pointer;color:#10131a;}
  #businessModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:9999;overflow-y:auto;}
  .bizCard{background:#1c2333;max-width:640px;margin:40px auto;padding:28px;border-radius:16px;border:2px solid var(--gold);}
  .bizCard h2{color:var(--gold);margin-bottom:8px;}
  .bizCard p{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .bizCard label{font-size:11px;color:var(--muted);display:block;margin:10px 0 5px;}
  .bizCard select,.bizCard input,.bizCard textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #33405a;background:#0e1628;color:var(--text);font-size:14px;outline:none;}
  .bizCard select:focus,.bizCard input:focus,.bizCard textarea:focus{border-color:var(--gold);}
  .bizCard textarea{height:200px;resize:vertical;}
  #assetsList{margin-top:14px;display:flex;flex-wrap:wrap;}
  .bizBtns{display:flex;gap:10px;margin-top:18px;}
  .bizBtns button{flex:1;padding:13px;border:none;border-radius:10px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<header>
  <span style="font-size:22px" id="coachEmoji">🧠</span>
  <h1 id="coachTitle">E5 AI COACH</h1>
  <select id="coachSelect" onchange="switchCoach()">
    <option value="e5" id="optE5">E5 Coach</option>
    <option value="builder" id="optB">The Builder</option>
  </select>
  <button class="langBtn" id="langEn" onclick="setLang('en')">EN</button>
  <button class="langBtn" id="langAr" onclick="setLang('ar')">عربي</button>
  <button class="langBtn" id="bizBtn" onclick="openBusinessModal()">📋 My Business</button>
  <span class="tag" id="memberTag">GUEST</span>
</header>

<div id="onboarding">
  <div class="card">
    <h2 id="onboardTitle">Welcome, Future Empire Builder 👋</h2>
    <p id="onboardDesc">I'm your personal AI Coach. I remember your niche, your stage, and every session we have together.</p>
    <label id="lblName">YOUR NAME</label>
    <input id="nameInput" placeholder="e.g. Ahmed">
    <label id="lblNiche">YOUR NICHE / BUSINESS</label>
    <input id="nicheInput" placeholder="e.g. Fitness coaching for busy dads">
    <button id="startBtn" onclick="startCoaching()">🚀 START COACHING</button>
  </div>
</div>

<div id="chatScreen">
  <div id="messages"></div>
  <div id="inputBar">
    <input id="userInput" placeholder="Ask your coach anything…">
    <button id="micBtn" onclick="toggleMic()">🎤</button>
    <button id="sendBtn" onclick="send()">➤</button>
  </div>
</div>

<!-- BUSINESS SECTIONS MODAL -->
<div id="businessModal">
  <div class="bizCard">
    <h2 id="bizTitle">📋 My Business Sections</h2>
    <p id="bizDesc">Add your business section by section. The coach reads every section and will ask for what's missing.</p>
    <label id="lblSection">SECTION</label>
    <select id="assetType"></select>
    <label id="lblTitle">TITLE (OPTIONAL)</label>
    <input id="assetTitle" placeholder="e.g. Main sales page v2">
    <label id="lblUrl">LINK / URL (OPTIONAL)</label>
    <input id="assetUrl" placeholder="https://…">
    <label id="lblCopy">PASTE THE COPY / CONTENT</label>
    <textarea id="businessInput" placeholder="Paste the full copy of this section here…"></textarea>
    <div id="assetsList"></div>
    <div class="bizBtns">
      <button id="bizSave" onclick="saveBusinessContext()" style="background:var(--gold);color:#10131a;">💾 Save Section</button>
      <button id="bizCancel" onclick="closeBusinessModal()" style="background:#233047;color:var(--text);">Close</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#{1,3}\s?(.*)$/gm,'<strong>📌 $1</strong>').replace(/\n/g,'<br>');
const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9\u0600-\u06FF]+/g,'_').replace(/^_|_$/g,'');

let LANG=localStorage.getItem('e5_lang')||'en';
const STR={
 en:{onTitle:'Welcome, Future Empire Builder 👋',onDesc:"I'm your personal AI Coach. I remember your niche, your stage, and every session we have together.",lblName:'YOUR NAME',lblNiche:'YOUR NICHE / BUSINESS',btn:'🚀 START COACHING',ph:'Ask your coach anything…',optE5:'E5 Coach',optB:'The Builder',listen:'🔊 Listen',playing:'🔉 Playing…',micErr:'Microphone access denied',voiceErr:'Voice error — try again',biz:'📋 My Business',bizTitle:'📋 My Business Sections',bizDesc:"Add your business section by section. The coach reads every section and will ask for what's missing.",lblSection:'SECTION',lblTitle:'TITLE (OPTIONAL)',lblUrl:'LINK / URL (OPTIONAL)',lblCopy:'PASTE THE COPY / CONTENT',bizPh:'Paste the full copy of this section here…',bizSave:'💾 Save Section',bizCancel:'Close',bizSaved:'✅ Section saved! The coach can now review it.',bizFail:'⚠️ Failed to save. Try again.',bizFirst:'Start coaching first!',noAssets:'No sections saved yet. Add your first one above.'},
 ar:{onTitle:'مرحباً بك، باني الإمبراطورية المستقبلي 👋',onDesc:'أنا مدربك الشخصي بالذكاء الاصطناعي. أتذكّر مجالك ومرحلتك وكل جلسة نخوضها معاً.',lblName:'اسمك',lblNiche:'مجالك / عملك',btn:'🚀 ابدأ التدريب',ph:'اسأل مدربك أي شيء…',optE5:'مدرب E5',optB:'الباني 🏗️',listen:'🔊 استمع',playing:'🔉 يشغل…',micErr:'تم رفض الوصول إلى الميكروفون',voiceErr:'خطأ في الصوت — حاول مجدداً',biz:'📋 أعمالي',bizTitle:'📋 أقسام أعمالي',bizDesc:'أضف عملك قسماً قسماً. يقرأ المدرب كل قسم وسيطلب ما ينقص.',lblSection:'القسم',lblTitle:'العنوان (اختياري)',lblUrl:'رابط (اختياري)',lblCopy:'الصق النص / المحتوى',bizPh:'الصق نص هذا القسم كاملاً هنا…',bizSave:'💾 حفظ القسم',bizCancel:'إغلاق',bizSaved:'✅ تم حفظ القسم! يمكن للمدرب مراجعته الآن.',bizFail:'⚠️ فشل الحفظ. حاول مجدداً.',bizFirst:'ابدأ التدريب أولاً!',noAssets:'لا أقسام محفوظة بعد. أضف أول قسم من الأعلى.'}
};
const T=(en,ar)=>LANG==='ar'?ar:en;
const S=()=>STR[LANG];

const ASSETS={
 sales_page:['🛒 Sales Page','🛒 صفحة البيع'],
 squeeze_page:['🧲 Squeeze Page','🧲 صفحة الالتقاط'],
 quiz_page:['❓ Quiz Page','❓ صفحة الاختبار'],
 thank_you_page:['🙏 Thank-You Page','🙏 صفحة الشكر'],
 email_copy:['✉️ Email Copy','✉️ نسخ الرسائل'],
 social_channel:['📺 Social / YouTube','📺 قناة اجتماعية / يوتيوب'],
 customer_avatar:['👤 Customer Avatar','👤 العميل المثالي'],
 business_details:['🏢 Business Details','🏢 تفاصيل العمل'],
 other:['📎 Other',' أخرى']
};
let assetsCache=[];

function applyLang(){
  document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  const s=S();
  $('onboardTitle').textContent=s.onTitle;
  $('onboardDesc').textContent=s.onDesc;
  $('lblName').textContent=s.lblName;
  $('lblNiche').textContent=s.lblNiche;
  $('startBtn').textContent=s.btn;
  $('userInput').placeholder=s.ph;
  $('optE5').textContent=s.optE5;
  $('optB').textContent=s.optB;
  $('bizBtn').textContent=s.biz;
  $('langEn').style.opacity=LANG==='en'?1:.4;
  $('langAr').style.opacity=LANG==='ar'?1:.4;
  localStorage.setItem('e5_lang',LANG);
}
function setLang(l){LANG=l;applyLang();}

/* ---------- BUSINESS SECTIONS ---------- */
function fillAssetOptions(){
  const sel=$('assetType'); sel.innerHTML='';
  Object.keys(ASSETS).forEach(k=>{
    const o=document.createElement('option');
    o.value=k;
    o.textContent=(ASSETS[k])[LANG==='ar'?1:0];
    sel.appendChild(o);
  });
}
function renderAssets(){
  const box=$('assetsList'); box.innerHTML='';
  if(!assetsCache.length){
    box.innerHTML='<p style="color:var(--muted);font-size:12px;width:100%;">'+S().noAssets+'</p>';
    return;
  }
  assetsCache.forEach(a=>{
    const label=(ASSETS[a.asset_type]||['📎 '+a.asset_type,'📎 '+a.asset_type])[LANG==='ar'?1:0];
    const chip=document.createElement('button');
    chip.className='langBtn';
    chip.style.margin='3px';
    chip.textContent='✏️ '+label;
    chip.onclick=()=>{
      $('assetType').value=a.asset_type;
      $('assetTitle').value=a.title||'';
      $('assetUrl').value=a.url||'';
      $('businessInput').value=a.content||'';
    };
    box.appendChild(chip);
  });
}
async function loadAssets(){
  const mid=localStorage.getItem('e5_member_id');
  if(!mid) return;
  try{
    const r=await fetch('/api/assets?member_id='+encodeURIComponent(mid));
    const d=await r.json();
    assetsCache=d.assets||[];
    renderAssets();
  }catch(e){}
}
function openBusinessModal(){
  if(!localStorage.getItem('e5_member_id')){alert(S().bizFirst);return;}
  const s=S();
  $('bizTitle').textContent=s.bizTitle;
  $('bizDesc').textContent=s.bizDesc;
  $('lblSection').textContent=s.lblSection;
  $('lblTitle').textContent=s.lblTitle;
  $('lblUrl').textContent=s.lblUrl;
  $('lblCopy').textContent=s.lblCopy;
  $('businessInput').placeholder=s.bizPh;
  $('bizSave').textContent=s.bizSave;
  $('bizCancel').textContent=s.bizCancel;
  fillAssetOptions();
  loadAssets();
  $('businessModal').style.display='block';
}
function closeBusinessModal(){$('businessModal').style.display='none';}
async function saveBusinessContext(){
  const mid=localStorage.getItem('e5_member_id');
  try{
    const r=await fetch('/api/assets',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        member_id:mid,
        asset_type:$('assetType').value,
        title:$('assetTitle').value.trim()||null,
        content:$('businessInput').value.trim()||null,
        url:$('assetUrl').value.trim()||null
      })});
    if(!r.ok) throw 0;
    alert(S().bizSaved);
    $('businessInput').value=''; $('assetUrl').value=''; $('assetTitle').value='';
    await loadAssets();
  }catch(e){alert(S().bizFail);}
}

function attachTTS(d){
  const btn=document.createElement('button');
  btn.className='tts-btn';
  btn.innerHTML=S().listen;
  btn.onclick=async()=>{
    btn.innerHTML='⏳';
    try{
      const plainText=d.innerText.replace(/🔊[^]*?(?=\n|$)/g,'').replace(/🔉[^]*?(?=\n|$)/g,'').replace(/⏳/g,'').trim();
      const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:plainText,language:LANG})});
      if(!r.ok) throw 0;
      const blob=await r.blob();
      const a=new Audio(URL.createObjectURL(blob));
      btn.innerHTML=S().playing;
      a.onended=()=>{btn.innerHTML=S().listen;};
      a.onerror=()=>{btn.innerHTML='❌';};
      await a.play();
    }catch(e){btn.innerHTML='❌';}
  };
  d.appendChild(btn);
}

/* ---------- PUSH-TO-TALK ---------- */
let mediaRecorder=null, audioChunks=[], recording=false;
async function toggleMic(){
  if(!recording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);
      audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=async()=>{
        stream.getTracks().forEach(t=>t.stop());
        const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
        $('micBtn').textContent='⏳';
        const fd=new FormData();
        fd.append('file',blob,'voice.webm');
        fd.append('language',LANG);
        try{
          const r=await fetch('/api/stt',{method:'POST',body:fd});
          const d=await r.json();
          $('micBtn').textContent='🎤';
          if(d.text){ $('userInput').value=d.text; send(); }
        }catch(e){
          $('micBtn').textContent='🎤';
          alert(S().voiceErr);
        }
      };
      mediaRecorder.start();
      recording=true;
      $('micBtn').textContent='⏺️';
      $('micBtn').classList.add('rec');
    }catch(e){
      alert(S().micErr);
    }
  }else{
    mediaRecorder.stop();
    recording=false;
    $('micBtn').classList.remove('rec');
  }
}

window.addEventListener('load',()=>{
  applyLang();
  if(localStorage.getItem('e5_member_id')){
    $('memberTag').textContent=localStorage.getItem('e5_name')||'MEMBER';
    showChat();
    const d=addMsg('coach',T('Welcome back, <strong>'+esc(localStorage.getItem('e5_name')||'friend')+'</strong>! I remember you. Pick your coach above and let\'s continue your empire.','<strong>'+esc(localStorage.getItem('e5_name')||'صديقي')+'</strong>، مرحباً بعودتك! أتذكرك جيداً. اختر مدربك من الأعلى ولْنُكمل إمبراطوريتك.'));
    attachTTS(d);
  }
});

function switchCoach(){
  const c=$('coachSelect').value;
  let d;
  if(c==='builder'){
    $('coachTitle').textContent='THE BUILDER';
    $('coachEmoji').textContent='🏗️';
    d=addMsg('coach',T('🏗️ <strong>The Builder here.</strong> Offer first, audience second. Stop overthinking — do the work. Tell me: what are you building, and who exactly is it for?','🏗️ <strong>الباني هنا.</strong> العرض أولاً، الجمهور ثانياً. توقّف عن التفكير الزائد — اعمل. أخبرني: ماذا تبني، ولمن بالضبط؟'));
  }else{
    $('coachTitle').textContent='E5 AI COACH';
    $('coachEmoji').textContent='🧠';
    d=addMsg('coach',T('🧠 <strong>E5 Coach here.</strong> Let\'s sharpen your marketing with the E5 frameworks. What\'s blocking your empire today?','🧠 <strong>مدرب E5 هنا.</strong> لنصقل تسويقك بأطر E5. ما الذي يعيق إمبراطوريتك اليوم؟'));
  }
  attachTTS(d);
}

function startCoaching(){
  const name=$('nameInput').value.trim();
  const niche=$('nicheInput').value.trim();
  if(!name){alert(T('Please tell me your name first!','أخبرني اسمك أولاً!'));return;}
  const mid=slug(name)+'_'+Math.random().toString(36).slice(2,6);
  localStorage.setItem('e5_member_id',mid);
  localStorage.setItem('e5_name',name);
  localStorage.setItem('e5_niche',niche);
  fetch('/api/member/register',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({member_id:mid,name:name,niche:niche})}).catch(()=>{});
  $('memberTag').textContent=name;
  showChat();
  const d=addMsg('coach',T('It\'s an honor to meet you, <strong>'+esc(name)+'</strong>! Open 📋 My Business and add your sections (sales page, emails, avatar…) so I can coach your REAL business.','شرفٌ كبير أن ألتقيك يا <strong>'+esc(name)+'</strong>! افتح 📋 أعمالي وأضف أقسامك (صفحة البيع، الرسائل، العميل المثالي…) حتى أدرب عملك الفعلي.'));
  attachTTS(d);
}

function showChat(){$('onboarding').style.display='none';$('chatScreen').style.display='flex';}

function addMsg(who,html){
  const d=document.createElement('div');
  d.className='msg '+who;
  d.innerHTML=html;
  $('messages').appendChild(d);
  $('messages').scrollTop=$('messages').scrollHeight;
  return d;
}

async function send(){
  const q=$('userInput').value.trim();
  if(!q)return;
  $('userInput').value='';
  addMsg('user',esc(q));
  const t=addMsg('coach',T('🧠 <em>Coach is thinking…</em>','🧠 <em>المدرب يفكر…</em>'));
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,member_id:localStorage.getItem('e5_member_id'),coach_id:$('coachSelect').value,language:LANG})});
    const d=await r.json();
    t.innerHTML=md(d.answer||T('I could not process that. Please try again.','لم أستطع معالجة ذلك. حاول مجدداً.'));
    attachTTS(t);
  }catch(e){
    t.innerHTML=T('⚠️ Connection error. Please try again.','⚠️ خطأ في الاتصال. حاول مجدداً.');
  }
  $('messages').scrollTop=$('messages').scrollHeight;
}

$('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
