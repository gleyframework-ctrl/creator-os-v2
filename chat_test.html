<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E5 AI Coach - Income Engine</title>
<style>
:root{--bg:#0f1115;--panel:#13151a;--chat:#181b21;--ai:#22252a;--user:#ffd60a;--text:#e5e7eb;--muted:#9ca3af;--border:#2d3139;--accent:#ffd60a;--green:#22c55e;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;}
aside{width:270px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px;overflow-y:auto;}
.nosb aside{display:none;}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:22px;}
.logo .bolt{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#ffd60a,#22c55e);display:flex;align-items:center;justify-content:center;font-size:20px;}
.logo span{background:linear-gradient(90deg,#ffd60a,#22c55e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sec{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:12px;}
.mode{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:10px;cursor:pointer;color:var(--text);margin-bottom:6px;}
.mode:hover{border-color:var(--border);}
.mode.active{border-color:var(--accent);background:#1c1a05;}
.mode .ic{font-size:16px;margin-top:2px;}
.mode b{display:block;font-size:13px;}
.mode small{color:var(--muted);font-size:11px;line-height:1.3;display:block;}
.mode .lock{margin-left:auto;color:var(--muted);font-size:12px;}
.pulse{border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.chip{background:var(--chat);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:6px 10px;font-size:11px;cursor:pointer;}
.chip.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700;}
.streak{font-size:12px;color:var(--accent);margin-bottom:8px;}
.logbtn{width:100%;background:var(--accent);border:none;border-radius:6px;padding:8px;font-weight:700;cursor:pointer;color:#111;}
.tierbox{margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:12px;}
.badge{display:inline-block;background:#262626;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;margin:0 4px 8px 0;}
.tierbox input{width:100%;background:var(--chat);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;font-size:12px;margin-bottom:8px;}
.tierbox button{width:100%;background:var(--accent);border:none;border-radius:6px;padding:8px;font-weight:700;cursor:pointer;color:#111;}
main{flex:1;display:flex;flex-direction:column;}
header{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--panel);}
header h1{font-size:20px;}
header p{color:var(--muted);font-size:12px;margin-top:3px;}
.hbtns button{background:var(--ai);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;margin-left:6px;font-size:12px;}
.hbtns button.on{border-color:var(--accent);color:var(--accent);}
#homeView,#mapView{flex:1;overflow-y:auto;padding:28px;max-width:920px;margin:0 auto;width:100%;}
.line{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--chat);border:1px solid var(--border);border-radius:12px;padding:10px 16px;opacity:.45;transition:.4s;}
.node span{font-size:18px;}
.node small{font-size:10px;color:var(--muted);letter-spacing:1px;}
.node.on{opacity:1;border-color:var(--accent);box-shadow:0 0 18px rgba(255,214,10,.15);}
.wire{width:26px;height:2px;background:var(--border);}
.wire.on{background:var(--accent);}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1px solid var(--accent);background:linear-gradient(135deg,#1c1a05,#13151a);border-radius:16px;padding:20px;margin-bottom:18px;animation:fadeUp .5s ease;}
.herolabel{font-size:10px;letter-spacing:2px;color:var(--accent);margin-bottom:6px;}
.hero h2{font-size:18px;margin-bottom:6px;}
.hero p{color:var(--muted);font-size:12px;}
.herobtn{background:var(--accent);color:#111;border:none;border-radius:10px;padding:12px 20px;font-weight:800;font-size:14px;cursor:pointer;animation:glow 2s infinite;}
.mapchip{border:1px solid var(--border);background:var(--chat);border-radius:12px;padding:10px 14px;font-size:12px;margin-bottom:18px;animation:fadeUp .5s ease .05s both;}
.mapchip a{color:var(--accent);cursor:pointer;font-weight:700;}
.prog{margin-bottom:22px;animation:fadeUp .5s ease .1s both;}
.progtop{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
.bar{height:8px;background:var(--chat);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.fill{height:100%;background:linear-gradient(90deg,#ffd60a,#22c55e);transition:width .8s ease;}
.phase{margin-bottom:20px;animation:fadeUp .5s ease both;}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.phead b{font-size:14px;}
.phead small{color:var(--muted);font-size:11px;margin-left:auto;}
.pdone{color:var(--green);font-size:11px;font-weight:800;}
.picon{font-size:16px;}
.task{display:flex;align-items:center;gap:12px;background:var(--chat);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;animation:fadeUp .5s ease both;transition:.2s;}
.task:hover{transform:translateY(-1px);border-color:var(--muted);}
.task.done{opacity:.5;}
.task.done .tbody b{text-decoration:line-through;}
.task.next{border-color:var(--accent);animation:glow 2.4s infinite;}
.check{width:26px;height:26px;min-width:26px;border-radius:50%;border:1px solid var(--border);background:transparent;color:#111;font-weight:800;cursor:pointer;}
.task.done .check{background:var(--green);border-color:var(--green);}
.tbody{flex:1;}
.tbody b{font-size:13px;display:block;}
.tbody small{color:var(--muted);font-size:11px;}
.startbtn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
/* MAP */
.mapsub{color:var(--muted);font-size:12px;margin-bottom:18px;}
.q{margin-bottom:16px;animation:fadeUp .4s ease both;}
.q b{font-size:13px;display:block;margin-bottom:8px;}
.opts{display:flex;gap:8px;flex-wrap:wrap;}
.opt{background:var(--chat);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer;}
.opt.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700;}
.deck{display:flex;gap:24px;align-items:center;margin:18px 0;flex-wrap:wrap;}
.ringbox{position:relative;}
.ringbg{fill:none;stroke:var(--border);stroke-width:10;}
.ringfg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1.2s ease;}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:800;}
.ringtxt small{font-size:10px;color:var(--muted);}
.bars{flex:1;min-width:260px;}
.brow{margin-bottom:12px;}
.brow small{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
.btrack{height:10px;background:var(--chat);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.bfill{height:100%;width:0;transition:width 1s ease;border-radius:8px;}
.mind{display:flex;align-items:center;gap:6px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
.mnode{padding:8px 14px;border-radius:10px;border:2px solid;font-size:12px;font-weight:700;}
.leak{background:#1c0505;border:1px solid var(--red);border-radius:12px;padding:12px 16px;font-size:13px;margin:14px 0;}
.mapbtns{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
/* CHAT */
#chat{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;}
.msg{max-width:78%;padding:14px 18px;border-radius:12px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-wrap:break-word;}
.msg.user{align-self:flex-end;background:var(--user);color:#111;border-top-right-radius:2px;}
.msg.ai{align-self:flex-start;background:var(--ai);border:1px solid var(--border);border-top-left-radius:2px;}
.msg.ai strong{color:var(--accent);}
.msg.ai .h{color:var(--accent);font-weight:800;}
.msg.ai .li{padding-left:12px;}
.msg.ai pre{background:#000;border:1px solid var(--border);border-radius:8px;padding:10px;margin:8px 0;white-space:pre;overflow-x:auto;}
.speak{background:transparent;border:none;color:var(--muted);cursor:pointer;margin-left:10px;font-size:14px;}
.speak:hover{color:var(--accent);}
.typing{display:flex;gap:5px;padding:14px 18px;align-self:flex-start;}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bnc 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes bnc{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
#doneBar{display:none;align-items:center;gap:10px;padding:10px 24px;background:#1c1a05;border-top:1px solid var(--accent);font-size:13px;}
#doneBar button{background:var(--accent);color:#111;border:none;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:12px;}
#doneBar .later{background:transparent;color:var(--muted);border:1px solid var(--border);}
footer{padding:18px 24px;border-top:1px solid var(--border);background:var(--panel);display:flex;gap:12px;}
textarea{flex:1;background:var(--chat);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:10px;font-size:14px;resize:none;height:54px;outline:none;}
#send{background:var(--accent);border:none;border-radius:10px;width:90px;font-weight:700;cursor:pointer;color:#111;}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-90px);background:#1c1a05;border:1px solid var(--accent);color:var(--text);padding:12px 22px;border-radius:12px;font-weight:700;transition:.4s;z-index:99;}
#toast.show{transform:translateX(-50%) translateY(0);}
.confetti{position:fixed;top:-12px;width:8px;height:14px;z-index:98;animation:fall 1.5s linear forwards;border-radius:2px;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);}}
#tourCard{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:430px;width:92%;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:16px;z-index:97;animation:fadeUp .4s ease;}
#tourCard p{font-size:13px;line-height:1.5;margin-bottom:12px;}
#tourCard .tbtns{display:flex;gap:8px;justify-content:flex-end;}
#tourCard button{background:var(--accent);color:#111;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;}
#tourCard .skip{background:transparent;color:var(--muted);border:1px solid var(--border);}
.tour-hl{outline:2px solid var(--accent);box-shadow:0 0 24px rgba(255,214,10,.35);border-radius:12px;z-index:96;position:relative;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 4px rgba(255,214,10,.25)}50%{box-shadow:0 0 18px rgba(255,214,10,.5)}}
@media (max-width:900px){
 body{flex-direction:column;}
 aside{width:100%;padding:10px;}
 .logo,.sec{display:none;}
 #modes{display:flex;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;}
 .mode{min-width:160px;margin-bottom:0;}
 .tierbox,.pulse{display:none;}
}
</style>
</head>

function findTask(id){ for(const p of JOURNEY){ for(const t of p.tasks){ if(t.id===id) return t; } } return null; }
function phaseOf(id){ for(const p of JOURNEY){ for(const t of p.tasks){ if(t.id===id) return p; } } return null; }
function nextTask(){ for(const p of JOURNEY){ for(const t of p.tasks){ if(!done[t.id]) return t; } } return null; }
function startTaskById(id){
  const t = findTask(id); if(!t) return;
  if(RANK[tier] < RANK[modeTier(t.mode)]){ showView("chat"); addMsg("🔒 \""+T(t,"t")+"\" lives in a "+modeTier(t.mode).toUpperCase()+" tier mode. Paste your Whop license key to unlock it.", "ai"); unlockPrompt(); return; }
  mode = t.mode; renderModes(); showView("chat");
  activeTask = id;
  document.getElementById("input").value = t.prompt;
  send();
}
function updateDoneBar(){
  const bar = document.getElementById("doneBar");
  if(activeTask && !done[activeTask]){
    const t = findTask(activeTask);
    document.getElementById("doneTxt").textContent = (lang==="ar"?"انتهيت من ":"Finished ")+(t?T(t,"t"):"")+"?";
    bar.style.display = "flex";
  } else bar.style.display = "none";
}
function hideDoneBar(){ document.getElementById("doneBar").style.display = "none"; }
function markDone(){ if(activeTask) completeTask(activeTask); hideDoneBar(); }
function completeTask(id){
  if(done[id]) return;
  done[id] = true;
  localStorage.setItem("journey_" + memberId, JSON.stringify(done));
  const p = phaseOf(id);
  const phaseDone = p && p.tasks.every(t=>done[t.id]);
  if(phaseDone){ toast(CH[lang].toastPhase + T(p,"name") + "!"); confetti(40); }
  else { toast(CH[lang].toastStep); confetti(18); }
  renderHome(); updateDoneBar();
}
function toggleDone(id){
  if(done[id]){ done[id]=false; localStorage.setItem("journey_" + memberId, JSON.stringify(done)); renderHome(); }
  else completeTask(id);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}
function confetti(n){
  const colors = ["#ffd60a","#22c55e","#3b82f6","#ef4444","#e5e7eb"];
  for(let i=0;i<n;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random()*0.4) + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2000);
  }
}

  const total = JOURNEY.reduce((a,p)=>a+p.tasks.length,0);

  let html = '<div class="line">';
  const nodes = [["👀","ATTENTION"],["🏠","HUB"],["🎓","DEMONSTRATION"],["💰","CONVERSION"]];
  const activeNode = Math.min(3, Math.floor((doneCount/total)*4));
  nodes.forEach((n,i)=>{ html += '<div class="node'+(i<=activeNode?' on':'')+'"><span>'+n[0]+'</span><small>'+n[1]+'</small></div>'; if(i<3) html += '<div class="wire'+(i<activeNode?' on':'')+'"></div>'; });
  html += '</div>';
  if(sm){
    html += '<div class="mapchip">📊 '+C.momentum+': <b>'+sm.mom+'/100</b> · 💧 '+C.bigLeak+': <b>'+leakName(sm.leak)+'</b> · <a onclick="showView(\'map\')">'+C.openMap+'</a></div>';

  if(next){
    html += '<div class="hero"><div><div class="herolabel">'+C.next+'</div><h2>'+T(next,"t")+'</h2><p>'+T(next,"why")+' · ~'+next.min+' min · '+C.streak+calcStreak()+'-day</p></div><button class="herobtn" onclick="startTaskById(\''+next.id+'\')">'+C.start+' →</button></div>';
  } else {
    html += '<div class="hero"><div><div class="herolabel">JOURNEY COMPLETE</div><h2>'+(lang==="ar"?"بنيت الآلة. الآن شغّلها يومياً.":"You built the machine. Now run it daily.")+'</h2><p>'+C.streak+calcStreak()+'</p></div><button class="herobtn" onclick="showView(\'chat\')">'+C.tabChat+'</button></div>';
  }
  html += '<div class="prog"><div class="progtop"><span>'+C.prog+'</span><span>'+doneCount+'/'+total+' '+C.steps+'</span></div><div class="bar"><div class="fill" style="width:'+Math.round((doneCount/total)*100)+'%"></div></div></div>';
  JOURNEY.forEach((p,pi)=>{

    const complete = pd === p.tasks.length;
    html += '<div class="phase" style="animation-delay:'+(pi*0.08)+'s"><div class="phead"><span class="picon">'+p.icon+'</span><b>'+C.phase+' '+(pi+1)+' — '+T(p,"name")+'</b>'+(complete?'<span class="pdone">'+C.complete+'</span>':'')+'<small>'+pd+'/'+p.tasks.length+'</small></div>';

      html += '<button class="startbtn" onclick="startTaskById(\''+t.id+'\')">'+(locked?'🔒':(isDone?C.redo:C.start))+'</button>';
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById("homeView").innerHTML = html;
}

function buildMap(){
  if(answers.some(a=>a===null)){ toast(CH[lang].answerAll); return; }
  const t=answers[0], h=answers[1], n=answers[2], c=Math.round((answers[3]+answers[4])/2), r=answers[5];
  const mom = Math.round(((t+h+n+c)/8)*80 + (r/2)*20);
  const layers = {t:t,h:h,n:n,c:c};
  const leak = Object.keys(layers).reduce((a,b)=> layers[a]<=layers[b]?a:b);
  const map = {t:t,h:h,n:n,c:c,mom:mom,leak:leak};
  localStorage.setItem("map_" + memberId, JSON.stringify(map));
  confetti(18);
  renderMap(); renderHome();

/* ---------- CHAT ---------- */
function fmt(text){
  let s = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s = s.replace(/```([\s\S]*?)```/g, function(m,c){ return "<pre>"+c+"</pre>"; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/^###\s?(.+)$/gm, "<span class='h'>$1</span>");
  s = s.replace(/^##\s?(.+)$/gm, "<span class='h'>$1</span>");
  s = s.replace(/^#\s?(.+)$/gm, "<span class='h'>$1</span>");
  s = s.replace(/^[-*]\s+(.+)$/gm, "<span class='li'>• $1</span>");
  return s;
}
function showTyping(){
  const c = document.getElementById("chat");
  const d = document.createElement("div");
  d.className = "typing"; d.id = "typing";
  d.innerHTML = "<span></span><span></span><span></span>";
  c.appendChild(d); c.scrollTop = c.scrollHeight;
}
function hideTyping(){ const t = document.getElementById("typing"); if(t) t.remove(); }
function addMsg(text, who){
  const c = document.getElementById("chat");
  const d = document.createElement("div");
  d.className = "msg "+who;
  const s = document.createElement("span");
  if(who==="ai"){ s.innerHTML = fmt(text); } else { s.textContent = text; }
  d.appendChild(s);
  if(who==="ai"){
    const b = document.createElement("button");
    b.className = "speak"; b.textContent = "🔊"; b.title = "Play voice";
    b.onclick = ()=> speak(text);
    d.appendChild(b);
  }
  c.appendChild(d); c.scrollTop = c.scrollHeight;
}
function speak(text){
  const clean = text.slice(0, 600);
  fetch(API_URL+"/api/tts", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text: clean})})
    .then(r=>{ if(!r.ok) throw new Error("TTS "+r.status); return r.blob(); })
    .then(blob=>{ const a = new Audio(URL.createObjectURL(blob)); a.play(); })
    .catch(e=> addMsg("⚠️ Voice failed: "+e.message, "ai"));
}
function exportChat(){
  const lines = [];
  document.querySelectorAll("#chat .msg").forEach(m=>{
    lines.push((m.classList.contains("user")?"YOU:\n":"COACH:\n") + m.querySelector("span").textContent);
  });
  const blob = new Blob([lines.join("\n\n")], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "income-engine-session.txt";
  a.click();
}
async function send(){
  const inp = document.getElementById("input");
  const text = inp.value.trim(); if(!text) return;
  addMsg(text, "user"); history.push({role:"user", content:text}); inp.value="";
  showTyping();
  const wire = (lang==="ar") ? ("[The user prefers Arabic. Respond fully in Arabic.] " + text) : text;
  try{
    const r = await fetch(API_URL+"/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:wire, history:history.slice(-16), mode:mode, member_id:memberId})});
    hideTyping();
    if(r.status===403){ addMsg("🔒 That mode is locked for your current tier. Unlock with your Whop license key.", "ai"); return; }
    const data = await r.json();
    const reply = data.reply || data.response || data.message || "Error.";
    addMsg(reply, "ai"); history.push({role:"assistant", content:reply});
    updateDoneBar();
  }catch(e){ hideTyping(); addMsg("⚠️ Connection error: "+e.message, "ai"); }
}
async function unlock(){
  const key = document.getElementById("lic").value.trim(); if(!key) return;
  try{
    const r = await fetch(API_URL+"/api/unlock", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({member_id:memberId, license_key:key})});
    const data = await r.json();
    if(!r.ok) throw new Error(data.detail || "invalid license");
    tier = data.tier; localStorage.setItem("tier", tier); renderModes(); renderHome();
    addMsg("✅ Unlocked: "+tier.toUpperCase()+" plan. All "+tier+" modes are now open.", "ai");
  }catch(e){ addMsg("⚠️ Unlock failed: "+e.message, "ai"); }
}
function unlockPrompt(){
  const key = prompt("Paste your Whop license key:");
  if(key){ document.getElementById("lic").value = key; unlock(); }
}

  try{
    const r = await fetch(API_URL+"/api/tier?member_id="+encodeURIComponent(memberId));
    const data = await r.json();
    if(data.tier){ tier = data.tier; localStorage.setItem("tier", tier); }
  }catch(e){}
  renderModes();
}
function renderModes(){
  const box = document.getElementById("modes");
  box.innerHTML = "";
  MODES.forEach(m=>{
    const locked = RANK[tier] < RANK[m.tier];
    const b = document.createElement("button");
    b.className = "mode" + (m.id===mode ? " active" : "");
    b.innerHTML = '<span class="ic">'+m.ic+'</span><span><b>'+T(m,"t")+'</b><small>'+T(m,"d")+'</small></span>'+(locked?'<span class="lock">🔒</span>':'');
    b.onclick = ()=>{ if(locked){ showView("chat"); addMsg("🔒 "+T(m,"t")+" is a "+m.tier.toUpperCase()+" tier mode. Paste your Whop license key to unlock it.", "ai"); return; } mode = m.id; renderModes(); showView("chat"); addMsg((lang==="ar"?"تم التبديل إلى ":"Switched to ")+T(m,"t")+".", "ai"); };
    box.appendChild(b);
  });
  document.getElementById("tierBadge").textContent = tier.toUpperCase()+" PLAN";
}
function toggleH(k){ habit[k] = !habit[k]; renderH(); }
function renderH(){
  document.getElementById("hC").classList.toggle("on", habit.c);
  document.getElementById("hCom").classList.toggle("on", habit.com);
  document.getElementById("hConv").classList.toggle("on", habit.conv);
}
function dayKey(d){ return d.toISOString().slice(0,10); }
function calcStreak(){
  const log = JSON.parse(localStorage.getItem("habit_log") || "{}");
  let streak = 0; const d = new Date();
  if(!log[dayKey(d)]) d.setDate(d.getDate()-1);
  while(log[dayKey(d)]){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function renderStreak(){ document.getElementById("streak").textContent = CH[lang].streak + calcStreak() + "-day streak"; }
function logDay(){
  const log = JSON.parse(localStorage.getItem("habit_log") || "{}");
  log[dayKey(new Date())] = {c:habit.c, com:habit.com, conv:habit.conv};
  localStorage.setItem("habit_log", JSON.stringify(log));
  renderStreak();
  const streak = calcStreak();
  const msg = "DAILY CHECK-IN - Content: " + (habit.c?"YES":"NO") + " | Community: " + (habit.com?"YES":"NO") + " | Conversations: " + (habit.conv?"YES":"NO") + " | Streak: " + streak + " days. Act as my accountability coach: celebrate what I did, call out what I skipped with empathy (no guilt), and give me ONE focus for tomorrow. Also update my memory with this check-in and my streak.";
  habit = {c:false, com:false, conv:false}; renderH();
  showView("chat");
  document.getElementById("input").value = msg;
  send();
}
function clearChat(){ history=[]; document.getElementById("chat").innerHTML=""; addMsg(lang==="ar"?"تم مسح المحادثة. على ماذا نعمل؟":"Chat cleared. What are we working on?", "ai"); }
loadTier(); renderStreak(); applyLang(); showView("home");
if(!localStorage.getItem("tour_" + memberId)){ setTimeout(()=>{ tourI=0; showTour(); }, 800); }
addMsg(CH[lang].welcome, "ai");
</script>
</body>
</html>
