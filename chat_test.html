<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E5 AI Coach - CCC Brain</title>
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-chat: #181b21;
            --bg-user: #2563eb;
            --bg-ai: #22252a;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --accent: #10b981;
            --border: #2d3139;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #13151a; }
        header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        header h1 span { color: var(--accent); }
        .controls { display: flex; gap: 12px; align-items: center; }
        select, button { background: var(--bg-ai); color: var(--text-main); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        select:hover, button:hover { border-color: var(--accent); }
        button.clear-btn { background: transparent; color: #ef4444; border: 1px solid #7f1d1d; font-size: 12px; padding: 6px 10px; }
        button.clear-btn:hover { background: #7f1d1d; color: white; }

        /* Chat Area */
        #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: var(--bg-user); color: white; border-bottom-right-radius: 2px; }
        .message.ai { align-self: flex-start; background: var(--bg-ai); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .message.ai strong { color: var(--accent); }
        .message.ai code { background: #000; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #f87171; }
        .message.ai pre { background: #000; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 10px 0; }
        .message.ai pre code { background: transparent; color: #e5e7eb; padding: 0; }
        
        /* Typing Indicator */
        .typing { display: flex; gap: 4px; padding: 14px 18px; align-self: flex-start; }
        .typing span { width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Input Area */
        footer { padding: 20px 24px; border-top: 1px solid var(--border); background: #13151a; }
        .input-wrapper { max-width: 900px; margin: 0 auto; display: flex; gap: 12px; }
        textarea { flex: 1; background: var(--bg-chat); border: 1px solid var(--border); color: var(--text-main); padding: 14px; border-radius: 8px; font-size: 15px; resize: none; height: 56px; outline: none; transition: 0.2s; }
        textarea:focus { border-color: var(--accent); }
        button.send-btn { background: var(--accent); color: #000; font-weight: 600; border: none; width: 80px; }
        button.send-btn:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>🧠 E5 AI Coach <span>| CCC Brain</span></h1>
        <div class="controls">
            <select id="mode-select" title="Select Strategist Mode">
                <option value="coach">🧭 Daily Operator (Coach)</option>
                <option value="xray">🩺 Business X-Ray (Audit)</option>
                <option value="funnel">🌊 Funnel Map</option>
                <option value="community">🏛️ Community OS</option>
                <option value="dm">💬 DM Doctor</option>
                <option value="offer">📄 Offer Doc Builder</option>
                <option value="workshop">🎪 Workshop Architect</option>
                <option value="content">✍️ Content Engine</option>
                <option value="launch">🚀 Launch Planner</option>
                <option value="alchemy">🎬 Alchemy (Video)</option>
            </select>
            <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="message ai">Welcome to the CCC Diagnostic Brain. I am your $10K-level Strategist. Tell me about the current state of your ecosystem, or select a specific mode from the top right to begin.</div>
    </div>

    <footer>
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="Ask a question, paste a post for review, or describe your bottleneck..." onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </footer>

    <script>
        // ⚠️ IMPORTANT: If you are opening this HTML file directly in your browser, 
        // paste your Railway backend URL here. Example: "https://e5-ai-coach.up.railway.app"
        // If this HTML is hosted on the SAME domain as your backend, leave it as "".
        const API_URL = ""; 

        let history = [];
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modeSelect = document.getElementById('mode-select');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            // Basic formatting for AI responses
            if (sender === 'ai') {
                text = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
                text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            }
            div.innerHTML = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typing-indicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            history.push({ role: 'user', content: text });
            userInput.value = '';
            sendBtn.disabled = true;
            showTyping();

            try {
                const response = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: history.slice(-16), // Keep last 16 messages for context limit
                        mode: modeSelect.value
                    })
                });

                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                
                const data = await response.json();
                removeTyping();
                
                // Handle flexible response keys from main.py
                const aiReply = data.reply || data.response || data.message || "I encountered an error processing that.";
                
                addMessage(aiReply, 'ai');
                history.push({ role: 'assistant', content: aiReply });

            } catch (error) {
                removeTyping();
                addMessage(`⚠️ Connection Error: ${error.message}. Check your API_URL in the HTML or your Railway logs.`, 'ai');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            if (confirm("Clear conversation and reset brain?")) {
                history = [];
                chatContainer.innerHTML = '<div class="message ai">Chat cleared. CCC Brain reset. What are we working on?</div>';
            }
        }
    </script>
</body>
</html>
