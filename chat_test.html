<!-- 🌌 GOOGOL-PLEX DASHBOARD UI (Add this inside your main container) -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
    <!-- Omni Audit Card -->
    <div class="bg-dark-800 border border-slate-700 rounded-xl p-4">
        <h3 class="text-amber-400 font-bold mb-2 flex items-center"><i class="fas fa-stethoscope mr-2"></i> Omni-Audit</h3>
        <div class="space-y-2 text-sm text-slate-300">
            <input type="number" id="audit-leads" placeholder="Leads/mo" class="w-full bg-dark-900 border border-slate-600 rounded px-2 py-1">
            <input type="number" id="audit-close" placeholder="Close Rate %" class="w-full bg-dark-900 border border-slate-600 rounded px-2 py-1">
            <input type="number" id="audit-ltv" placeholder="Avg LTV $" class="w-full bg-dark-900 border border-slate-600 rounded px-2 py-1">
            <input type="text" id="audit-pain" placeholder="Biggest Pain Point" class="w-full bg-dark-900 border border-slate-600 rounded px-2 py-1">
            <button onclick="runOmniAudit()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded mt-2">Run Omni-Audit</button>
        </div>
        <div id="audit-result" class="mt-3 text-xs text-slate-400 whitespace-pre-wrap hidden"></div>
    </div>

    <!-- Daily 100 Card -->
    <div class="bg-dark-800 border border-slate-700 rounded-xl p-4">
        <h3 class="text-green-400 font-bold mb-2 flex items-center"><i class="fas fa-bullseye mr-2"></i> Rule of 100 Generator</h3>
        <div class="space-y-2 text-sm text-slate-300">
            <select id="d100-stage" class="w-full bg-dark-900 border border-slate-600 rounded px-2 py-1">
                <option>Lead Gen</option><option>Scaling</option><option>Retention</option>
            </select>
            <input type="text" id="d100-niche" placeholder="Your Niche (e.g., B2B SaaS)" class="w-full bg-dark-900 border border-slate-600 rounded px-2 py-1">
            <button onclick="generateDaily100()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded mt-2">Generate Daily 100</button>
        </div>
        <div id="d100-result" class="mt-3 text-xs text-slate-400 whitespace-pre-wrap hidden"></div>
    </div>

    <!-- Closing Roleplay Card -->
    <div class="bg-dark-800 border border-slate-700 rounded-xl p-4">
        <h3 class="text-purple-400 font-bold mb-2 flex items-center"><i class="fas fa-chess mr-2"></i> Closing Roleplay</h3>
        <div class="space-y-2 text-sm text-slate-300">
            <select id="rp-scenario" class="w-full bg-dark-900 border border-slate-600 rounded px-2 py-1">
                <option>Price Objection</option><option>Need to think about it</option><option>Need to ask my partner</option>
            </select>
            <input type="text" id="rp-message" placeholder="What you just said to the prospect..." class="w-full bg-dark-900 border border-slate-600 rounded px-2 py-1">
            <button onclick="runRoleplay()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 rounded mt-2">Simulate Prospect</button>
        </div>
        <div id="rp-result" class="mt-3 text-xs text-slate-400 whitespace-pre-wrap hidden"></div>
    </div>
</div>

<script>
// 🌌 GOOGOL-PLEX JAVASCRIPT FUNCTIONS
async function runOmniAudit() {
    const btn = event.target; btn.innerText = "Analyzing...";
    const payload = {
        current_leads_per_month: parseInt(document.getElementById('audit-leads').value) || 0,
        close_rate_percent: parseFloat(document.getElementById('audit-close').value) || 0,
        average_ltv: parseFloat(document.getElementById('audit-ltv').value) || 0,
        biggest_pain_point: document.getElementById('audit-pain').value || "Unknown"
    };
    try {
        const res = await fetch('/api/omni-audit', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        const resultDiv = document.getElementById('audit-result');
        resultDiv.innerText = data.audit;
        resultDiv.classList.remove('hidden');
    } catch(e) { console.error(e); }
    btn.innerText = "Run Omni-Audit";
}

async function generateDaily100() {
    const btn = event.target; btn.innerText = "Generating...";
    const payload = {
        current_stage: document.getElementById('d100-stage').value,
        niche: document.getElementById('d100-niche').value
    };
    try {
        const res = await fetch('/api/daily-100', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        const resultDiv = document.getElementById('d100-result');
        resultDiv.innerText = data.daily_plan;
        resultDiv.classList.remove('hidden');
    } catch(e) { console.error(e); }
    btn.innerText = "Generate Daily 100";
}

async function runRoleplay() {
    const btn = event.target; btn.innerText = "Simulating...";
    const payload = {
        scenario: document.getElementById('rp-scenario').value,
        user_message: document.getElementById('rp-message').value
    };
    try {
        const res = await fetch('/api/roleplay', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        const resultDiv = document.getElementById('rp-result');
        resultDiv.innerText = data.roleplay_response;
        resultDiv.classList.remove('hidden');
    } catch(e) { console.error(e); }
    btn.innerText = "Simulate Prospect";
}
</script>
