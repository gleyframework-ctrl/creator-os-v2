<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E5 AI Coach</title>
<style>
  :root{--bg:#0e1628;--panel:#1c2333;--gold:#f5b942;--text:#f5f9fc;--muted:#8a94a6;--user:#2563eb;--coach:#233047;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
  body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}
  header{background:var(--panel);padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--gold);}
  header h1{font-size:17px;letter-spacing:.5px;}
  #coachSelect{background:#0e1628;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:5px 12px;font-size:12px;outline:none;cursor:pointer;}
  header .tag{margin-left:auto;font-size:11px;color:var(--gold);border:1px solid var(--gold);padding:3px 8px;border-radius:20px;}
  #onboarding{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--panel);border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4);}
  .card h2{color:var(--gold);margin-bottom:6px;}
  .card p{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .card label{font-size:12px;color:var(--muted);display:block;margin:12px 0 6px;}
  .card input{width:100%;padding:12px;border-radius:10px;border:1px solid #33405a;background:#0e1628;color:var(--text);font-size:14px;outline:none;}
  .card input:focus{border-color:var(--gold);}
  .card button{width:100%;margin-top:20px;padding:13px;border:none;border-radius:10px;background:var(--gold);color:#10131a;font-weight:700;font-size:15px;cursor:pointer;}
  #chatScreen{flex:1;display:none;flex-direction:column;height:100%;}
  #messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:82%;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.55;}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px;}
  .msg.coach{align-self:flex-start;background:var(--coach);border:1px solid #2e3b55;border-bottom-left-radius:4px;}
  .msg.coach strong{color:var(--gold);}
  #inputBar{display:flex;gap:10px;padding:14px;background:var(--panel);border-top:1px solid #2e3b55;}
  #userInput{flex:1;padding:13px;border-radius:12px;border:1px solid #33405a;background:#0e1628;color:var(--text);font-size:14px;outline:none;}
  #userInput:focus{border-color:var(--gold);}
  #sendBtn{padding:0 22px;border:none;border-radius:12px;background:var(--gold);font-weight:700;cursor:pointer;color:#10131a;}
</style>
</head>
<body>
<header>
  <span style="font-size:22px" id="coachEmoji">🧠</span>
  <h1 id="coachTitle">E5 AI COACH</h1>
  <select id="coachSelect" onchange="switchCoach()">
    <option value="e5">E5 Coach</option>
    <option value="builder">The Builder</option>
  </select>
  <span class="tag" id="memberTag">GUEST</span>
</header>

<div id="onboarding">
  <div class="card">
    <h2>Welcome, Future Empire Builder 👋</h2>
    <p>I'm your personal AI Coach. I remember your niche, your stage, and every session we have together.</p>
    <label>YOUR NAME</label>
    <input id="nameInput" placeholder="e.g. Ahmed">
    <label>YOUR NICHE / BUSINESS</label>
    <input id="nicheInput" placeholder="e.g. Fitness coaching for busy dads">
    <button onclick="startCoaching()">🚀 START COACHING</button>
  </div>
</div>

<div id="chatScreen">
  <div id="messages"></div>
  <div id="inputBar">
    <input id="userInput" placeholder="Ask your coach anything…">
    <button id="sendBtn" onclick="send()">➤</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#{1,3}\s?(.*)$/gm,'<strong>📌 $1</strong>').replace(/\n/g,'<br>');
const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');

window.addEventListener('load',()=>{
  if(localStorage.getItem('e5_member_id')){
    $('memberTag').textContent=localStorage.getItem('e5_name')||'MEMBER';
    showChat();
    addMsg('coach','Welcome back, <strong>'+esc(localStorage.getItem('e5_name')||'friend')+'</strong>! I remember you. Pick your coach above and let\'s continue your empire.');
  }
});

function switchCoach(){
  const c=$('coachSelect').value;
  if(c==='builder'){
    $('coachTitle').textContent='THE BUILDER';
    $('coachEmoji').textContent='🏗️';
    addMsg('coach','🏗️ <strong>The Builder here.</strong> Offer first, audience second. Stop overthinking — do the work. Tell me: what are you building, and who exactly is it for?');
  }else{
    $('coachTitle').textContent='E5 AI COACH';
    $('coachEmoji').textContent='🧠';
    addMsg('coach','🧠 <strong>E5 Coach here.</strong> Let\'s sharpen your marketing with the E5 frameworks. What\'s blocking your empire today?');
  }
}

function startCoaching(){
  const name=$('nameInput').value.trim();
  const niche=$('nicheInput').value.trim();
  if(!name){alert('Please tell me your name first!');return;}
  const mid=slug(name)+'_'+Math.random().toString(36).slice(2,6);
  localStorage.setItem('e5_member_id',mid);
  localStorage.setItem('e5_name',name);
  localStorage.setItem('e5_niche',niche);
  fetch('/api/member/register',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({member_id:mid,name:name,niche:niche})}).catch(()=>{});
  $('memberTag').textContent=name;
  showChat();
  addMsg('coach','It\'s an honor to meet you, <strong>'+esc(name)+'</strong>! Pick your coach above — or just ask me anything right now. What is the biggest struggle blocking your empire?');
}

function showChat(){$('onboarding').style.display='none';$('chatScreen').style.display='flex';}

function addMsg(who,html){
  const d=document.createElement('div');
  d.className='msg '+who;
  d.innerHTML=html;
  $('messages').appendChild(d);
  $('messages').scrollTop=$('messages').scrollHeight;
  return d;
}

async function send(){
  const q=$('userInput').value.trim();
  if(!q)return;
  $('userInput').value='';
  addMsg('user',esc(q));
  const t=addMsg('coach','🧠 <em>Coach is thinking…</em>');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,member_id:localStorage.getItem('e5_member_id'),coach_id:$('coachSelect').value})});
    const d=await r.json();
    t.innerHTML=md(d.answer||'I could not process that. Please try again.');
  }catch(e){
    t.innerHTML='⚠️ Connection error. Please try again.';
  }
  $('messages').scrollTop=$('messages').scrollHeight;
}

$('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
