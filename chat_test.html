<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Income Engine — your $10K-level Community Conversion strategist. Journey, Business Map and AI coach in one command center.">
<title>Income Engine — CCC Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg-primary:#080C1A; --bg-surface:#0F1529; --bg-elevated:#192045; --bg-input:#0A1020;
 --border:#192045; --border-hover:#2A3A6A; --border-active:#F5A623;
 --gold:#F5A623; --gold-dim:#D48C1A;
 --gold-faint:rgba(245,166,35,.08); --gold-glow:rgba(245,166,35,.15); --gold-pulse:rgba(245,166,35,.3);
 --cyan:#00D4FF; --cyan-faint:rgba(0,212,255,.08);
 --success:#00E599; --success-faint:rgba(0,229,153,.08);
 --warning:#FFB800; --warning-faint:rgba(255,184,0,.08);
 --error:#FF4757; --error-faint:rgba(255,71,87,.08);
 --text-primary:#FFFFFF; --text-secondary:#8892B0; --text-muted:#4A5578;
 --font-sans:"Inter",ui-sans-serif,system-ui,sans-serif;
 --font-mono:"JetBrains Mono",ui-monospace,monospace;
 --r-card:12px; --r-hero:16px; --r-ctl:6px;
 --t-fast:120ms; --t-base:160ms; --t-slow:200ms; --t-meter:500ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg-primary);color:var(--text-secondary);font-family:var(--font-sans);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:var(--font-sans);}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 3px var(--gold-faint);border-color:var(--border-active);}
.mono{font-family:var(--font-mono);}
.vsr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
#topbar{height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--bg-primary);position:relative;z-index:5;}
.crumb{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:13px;}
.crumb b{color:var(--text-primary);font-weight:600;}
.logotile{width:28px;height:28px;border-radius:6px;background:var(--gold);color:var(--bg-primary);font:700 11px var(--font-mono);display:flex;align-items:center;justify-content:center;}
.tspace{flex:1;}
.chipbtn{background:transparent;border:1px solid var(--border-hover);color:var(--text-secondary);border-radius:var(--r-ctl);padding:6px 10px;font-size:12px;cursor:pointer;transition:all var(--t-base) ease;}
.chipbtn:hover{border-color:var(--gold-dim);background:var(--bg-elevated);color:var(--text-primary);}
.kbd .k{border:1px solid var(--border-hover);border-radius:4px;padding:1px 6px;font-size:10px;font-family:var(--font-mono);}
.livechip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9999px;padding:6px 12px;font:500 11px var(--font-mono);color:var(--text-secondary);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:dot-pulse 2s ease-in-out infinite;}
.dotring{position:relative;}
.dotring::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--success);animation:pulse-ring 1.5s ease-out infinite;}
.btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:var(--bg-primary);border:none;border-radius:var(--r-ctl);padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 6px 20px -8px var(--gold-glow);transition:filter var(--t-fast) ease,box-shadow var(--t-base) ease;}
.btn-gold:hover:not(:disabled){filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 6px 24px -8px var(--gold-pulse);}
.btn-gold:active{transform:translateY(1px);}
.btn-gold:disabled{opacity:.35;cursor:not-allowed;filter:none;}
.btn-ghost{background:transparent;border:1px solid var(--border-hover);color:var(--text-primary);border-radius:var(--r-ctl);padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;transition:all var(--t-base) ease;}
.btn-ghost:hover{background:var(--bg-elevated);border-color:var(--gold-dim);}
.btn-goldline{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);border-radius:var(--r-ctl);padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--t-base) ease;}
.btn-goldline:hover{background:var(--gold-faint);border-color:var(--gold);}
#shell{display:flex;height:calc(100vh - 52px);}
#rail{width:64px;background:var(--bg-surface);border-right:1px solid var(--border);overflow:hidden;transition:width var(--t-slow) ease-out;flex-shrink:0;display:flex;flex-direction:column;}
#rail:hover,#shell.railwide #rail{width:220px;}
.ritem{display:flex;align-items:center;gap:14px;padding:14px 22px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:all var(--t-base) ease;}
.ritem .ric{font:600 12px var(--font-mono);width:20px;text-align:center;}
.ritem .lbl{opacity:0;transition:opacity var(--t-base) ease;font-size:13px;font-weight:500;}
#rail:hover .lbl,#shell.railwide .lbl{opacity:1;}
.ritem:hover{color:var(--text-primary);}
.ritem.on{color:var(--gold);background:var(--gold-faint);}
.railfoot{margin-top:auto;padding:16px 22px;display:flex;gap:10px;align-items:center;font:500 10px var(--font-mono);color:var(--text-muted);white-space:nowrap;}
.railfoot span:last-child{opacity:0;transition:opacity var(--t-base) ease;}
#rail:hover .railfoot span:last-child,#shell.railwide .railfoot span:last-child{opacity:1;}
#main{flex:1;overflow-y:auto;position:relative;}
.hero{position:relative;margin:24px 32px 0;border:1px solid var(--border);border-radius:var(--r-hero);background:linear-gradient(180deg,var(--bg-surface),var(--bg-primary));overflow:hidden;padding:28px 32px;}
.hgrid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:44px 44px;opacity:.25;mask-image:radial-gradient(ellipse at 50% 0%,black,transparent 75%);pointer-events:none;}
.aur{position:absolute;width:340px;height:200px;border-radius:50%;filter:blur(30px);z-index:0;animation:aurora 14s ease-in-out infinite;pointer-events:none;}
.aur.a1{left:-60px;top:-80px;background:radial-gradient(circle,var(--gold-glow),transparent 70%);}
.aur.a2{right:-60px;top:-80px;background:radial-gradient(circle,var(--cyan-faint),transparent 70%);animation-delay:-7s;}
.hrow{position:relative;z-index:1;display:flex;gap:24px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);border-radius:9999px;padding:4px 12px;margin-bottom:14px;}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dot-pulse 2s infinite;}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--text-primary);margin-bottom:8px;}
h1 span{color:var(--gold);}
.hsub{max-width:560px;margin-bottom:20px;}
.kpis{display:flex;gap:16px;flex-wrap:wrap;}
.kpi{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-card);padding:14px 20px;min-width:130px;transition:border-color var(--t-base) ease;}
.kpi:hover{border-color:var(--border-hover);}
.kpi small{display:block;font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
.kpi .num{font:600 26px var(--font-mono);color:var(--gold);}
.kpi .num.cy{color:var(--cyan);} .kpi .num.gr{color:var(--success);} .kpi .num.mut{color:var(--text-muted);}
.ticker{position:relative;z-index:1;margin:22px -32px -28px;border-top:1px solid var(--border);overflow:hidden;background:var(--bg-primary);}
.tk{display:inline-flex;gap:40px;white-space:nowrap;padding:10px 0;font:500 11px var(--font-mono);color:var(--text-muted);animation:ticker 40s linear infinite;}
.stickybar{position:sticky;top:0;z-index:4;background:rgba(8,12,26,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 32px;margin-top:16px;}
.section{margin:28px 32px;}
.shead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.shead h3{font-size:14px;font-weight:600;color:var(--text-primary);}
.shead small{color:var(--text-muted);font-size:12px;}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-card);padding:20px 24px;transition:border-color var(--t-base) ease,transform var(--t-base) ease;}
.card:hover{border-color:var(--border-hover);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.step{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--r-ctl);padding:8px 14px;background:var(--bg-surface);}
.step .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-hover);display:flex;align-items:center;justify-content:center;font:600 10px var(--font-mono);color:var(--text-muted);}
.step .t{font-size:12px;font-weight:600;color:var(--text-secondary);}
.step.done .n{border-color:var(--success);color:var(--success);background:var(--success-faint);}
.step.active{border-color:var(--border-active);box-shadow:0 0 18px var(--gold-faint);position:relative;overflow:hidden;}
.step.active::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--gold-faint) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 2.4s linear infinite;}
.step.active .n{border-color:var(--gold);color:var(--gold);}
.step.active .t{color:var(--gold);}
.swire{width:18px;height:1px;background:var(--border);}
.spot{position:relative;border:1px solid var(--border-active);border-radius:var(--r-card);background:linear-gradient(135deg,var(--gold-faint),var(--bg-surface) 55%);padding:20px 24px;overflow:hidden;}
.spot::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,var(--gold-faint) 50%,transparent 65%);background-size:200% 100%;animation:shimmer 2.4s linear infinite;pointer-events:none;}
.spot .ey{font:600 11px var(--font-mono);letter-spacing:.08em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.spot h2{font-size:18px;color:var(--text-primary);margin-bottom:6px;}
.spot p{font-size:12px;color:var(--text-secondary);}
.mrow{margin-bottom:12px;}
.mrow .mt{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:5px;}
.mrow .mt .mono{color:var(--text-secondary);}
.mtrack{height:6px;background:var(--bg-elevated);border-radius:9999px;overflow:hidden;}
.mfill{height:100%;width:0;border-radius:9999px;background:var(--gold);transition:width var(--t-meter) ease;}
.task{display:flex;align-items:center;gap:14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-card);padding:14px 18px;margin-bottom:8px;transition:all var(--t-base) ease;animation:fadeUp .4s ease both;}
.task:hover{border-color:var(--border-hover);transform:translateY(-1px);}
.task.done{opacity:.5;}
.task.done .tb b{text-decoration:line-through;}
.task.next{border-color:var(--border-active);box-shadow:0 0 18px var(--gold-faint);}
.check{width:26px;height:26px;min-width:26px;border-radius:50%;border:1px solid var(--border-hover);background:transparent;color:var(--bg-primary);font-weight:800;cursor:pointer;transition:all var(--t-base) ease;}
.task.done .check{background:var(--success);border-color:var(--success);}
.tb{flex:1;}
.tb b{font-size:13px;color:var(--text-primary);display:block;}
.tb small{font-size:12px;color:var(--text-muted);}
.pill{border-radius:9999px;padding:2px 10px;font:600 10px var(--font-mono);letter-spacing:.06em;}
.pill.warn{background:var(--warning-faint);color:var(--warning);}
.pill.ok{background:var(--success-faint);color:var(--success);}
.startbtn{background:transparent;border:1px solid var(--border-hover);color:var(--text-primary);border-radius:var(--r-ctl);padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all var(--t-base) ease;}
.startbtn:hover{background:var(--bg-elevated);border-color:var(--gold-dim);}
.startbtn.hot{border-color:var(--gold-dim);color:var(--gold);}
.startbtn.hot:hover{background:var(--gold-faint);border-color:var(--gold);}
input,textarea{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-ctl);color:var(--text-primary);font-size:14px;font-family:var(--font-sans);outline:none;transition:border-color var(--t-base) ease,box-shadow var(--t-base) ease;}
input:focus,textarea:focus{border-color:var(--border-active);box-shadow:0 0 0 3px var(--gold-faint);}
input::placeholder,textarea::placeholder{color:var(--text-muted);}
#modes{display:flex;gap:8px;flex-wrap:wrap;margin:20px 32px 0;}
.mchip{display:flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:9999px;padding:7px 14px;font-size:12px;color:var(--text-secondary);cursor:pointer;transition:all var(--t-base) ease;}
.mchip .mi{font:600 10px var(--font-mono);color:var(--text-muted);}
.mchip:hover{border-color:var(--border-hover);color:var(--text-primary);}
.mchip.on{border-color:var(--border-active);color:var(--gold);background:var(--gold-faint);}
.mchip.on .mi{color:var(--gold);}
#chat{padding:20px 32px;display:flex;flex-direction:column;gap:14px;min-height:300px;}
.msg{max-width:78%;padding:14px 18px;border-radius:var(--r-card);line-height:1.6;font-size:14px;white-space:pre-wrap;word-wrap:break-word;animation:fadeUp .22s ease-out;}
.msg.user{align-self:flex-end;background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:var(--bg-primary);font-weight:500;}
.msg.ai{align-self:flex-start;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-secondary);}
.msg.ai strong{color:var(--gold);}
.msg.ai .h{color:var(--gold);font-weight:700;}
.msg.ai .li{padding-left:12px;}
.msg.ai pre{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-ctl);padding:10px;margin:8px 0;white-space:pre;overflow-x:auto;font-family:var(--font-mono);font-size:12px;}
.speak{background:transparent;border:none;color:var(--text-muted);cursor:pointer;margin-left:10px;font:600 10px var(--font-mono);}
.speak:hover{color:var(--gold);}
.typing{display:flex;gap:5px;padding:14px 18px;align-self:flex-start;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bnc 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
#chatfoot{display:flex;gap:12px;padding:16px 32px;border-top:1px solid var(--border);background:var(--bg-surface);}
#chatfoot textarea{flex:1;padding:12px 14px;height:52px;resize:none;}
#doneBar{display:none;align-items:center;gap:10px;padding:10px 32px;background:var(--gold-faint);border-top:1px solid var(--gold-dim);font-size:13px;color:var(--text-secondary);}
.mapwrap{margin:24px 32px;}
.opt{background:var(--bg-surface);border:1px solid var(--border);color:var(--text-secondary);border-radius:9999px;padding:8px 16px;font-size:12px;cursor:pointer;transition:all var(--t-base) ease;}
.opt.on{background:var(--gold-faint);border-color:var(--border-active);color:var(--gold);font-weight:600;}
.ringbg{fill:none;stroke:var(--bg-elevated);stroke-width:10;}
.ringfg{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1.2s ease;}
.leak{background:var(--error-faint);border:1px solid var(--error);border-radius:var(--r-card);padding:14px 18px;font-size:13px;color:var(--text-secondary);margin:16px 0;}
.leak b{color:var(--error);}
.pal{position:fixed;top:76px;left:50%;transform:translateX(-50%);width:560px;max-width:92%;z-index:99;background:var(--bg-surface);border:1px solid var(--border-hover);border-radius:12px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.85);animation:fadeUp .18s ease-out;}
.pal input{width:100%;background:var(--bg-input);border:none;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px;font-size:14px;}
.pal input:focus{box-shadow:none;border-color:var(--border-active);}
.palitem{padding:11px 16px;font-size:13px;color:var(--text-secondary);cursor:pointer;}
.palitem.sel{background:var(--gold-faint);color:var(--gold);}
#toast{position:fixed;bottom:20px;right:20px;background:var(--bg-surface);border:1px solid var(--border);border-left:3px solid var(--success);color:var(--text-primary);padding:12px 20px;border-radius:var(--r-card);font-weight:600;font-size:13px;opacity:0;transform:translateY(8px);transition:all .22s ease-out;z-index:99;}
#toast.show{opacity:1;transform:none;}
.confetti{position:fixed;top:-12px;width:3px;height:12px;z-index:98;animation:fall 1.5s linear forwards;border-radius:2px;}
#tourCard{position:fixed;bottom:20px;right:20px;max-width:360px;width:92%;background:var(--bg-surface);border:1px solid var(--border-active);border-radius:var(--r-card);padding:18px;z-index:97;animation:fadeUp .3s ease-out;}
#tourCard p{font-size:13px;line-height:1.55;margin-bottom:12px;color:var(--text-secondary);}
.tour-hl{outline:2px solid var(--gold);box-shadow:0 0 24px var(--gold-glow);border-radius:var(--r-card);position:relative;z-index:96;}
@keyframes dot-pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.2);opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes aurora{0%,100%{transform:translate3d(-4%,-2%,0) scale(1);opacity:.7}50%{transform:translate3d(4%,3%,0) scale(1.08);opacity:1}}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bnc{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:1100px){.grid2{grid-template-columns:1fr;}}
@media (max-width:900px){.kbd,.livechip{display:none;}}
@media (max-width:768px){
 #shell{flex-direction:column;}
 #rail{width:100%;height:52px;flex-direction:row;overflow-x:auto;}
 #rail:hover{width:100%;}
 .ritem{padding:14px 16px;}
 .ritem .lbl{opacity:1;}
 .railfoot{display:none;}
 .hero,.section,#modes,.mapwrap{margin-left:16px;margin-right:16px;}
 .stickybar{padding:12px 16px;}
 #chat,#chatfoot,#doneBar{padding-left:16px;padding-right:16px;}
 .ticker{margin:22px -16px -28px;}
 .opt,.mchip,.chipbtn,.startbtn{min-height:44px;}
}
</style>
</head>
<body>
<div id="topbar">
  <div class="crumb"><div class="logotile">IE</div><span>Income Engine</span><span>/</span><b id="crumbSec">Dashboard</b></div>
  <div class="tspace"></div>
  <button class="chipbtn kbd" onclick="openPal()" aria-label="Command palette"><span>Ask the coach</span> <span class="k">⌘K</span></button>
  <button class="chipbtn" onclick="toggleSb()" title="Pin sidebar" aria-label="Toggle sidebar">☰</button>
  <button class="chipbtn" id="langBtn" onclick="setLang(lang==='en'?'ar':'en')" aria-label="Language">ع</button>
  <div class="livechip"><span class="dot dotring"></span><span class="mono">api · online</span></div>
  <button class="btn-gold" id="ctaBtn" onclick="startNext()">Start Next Step ↗</button>
</div>
<div id="shell">
  <div id="rail">
    <div class="ritem on" id="tabHome" onclick="showView('home')"><span class="ric">01</span><span class="lbl" id="lbHome">Journey</span></div>
    <div class="ritem" id="tabMap" onclick="showView('map')"><span class="ric">02</span><span class="lbl" id="lbMap">Business Map</span></div>
    <div class="ritem" id="tabChat" onclick="showView('chat')"><span class="ric">03</span><span class="lbl" id="lbChat">Coach</span></div>
    <div class="railfoot"><span class="dot"></span><span id="sysTxt">SYS OK · v10</span></div>
  </div>
  <div id="main">
    <div id="homeView"></div>
    <div id="mapView" style="display:none"></div>
    <div id="chatView" style="display:none">
      <h1 class="vsr">Coach</h1>
      <div id="modes"></div>
      <div id="chat"></div>
      <div id="doneBar"><span id="doneTxt"></span><button class="btn-goldline" style="padding:6px 12px;font-size:12px" id="markBtn" onclick="markDone()">Mark done</button><button class="btn-ghost" style="padding:6px 12px;font-size:12px" id="laterBtn" onclick="hideDoneBar()">Later</button></div>
      <div id="chatfoot">
        <textarea id="input" placeholder="Describe your challenge or ask for guidance..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
        <button class="btn-gold" id="send" onclick="send()">Send</button>
        <button class="btn-ghost" onclick="exportChat()" title="Export" aria-label="Export session">↓</button>
        <button class="btn-ghost" onclick="clearChat()" title="Clear" aria-label="Clear chat">✕</button>
      </div>
    </div>
  </div>
</div>

  return '<div class="shead" style="margin-bottom:12px"><h3>'+c.plan+'</h3><span class="pill ok" id="memBadge">MEM</span></div><input id="lic" style="width:100%;padding:9px 12px;margin-bottom:10px" placeholder="'+c.lic+'"><button class="btn-ghost" style="width:100%" onclick="unlock()">'+c.unlock+'</button>';

/* ---------- MAP ---------- */
function ans(qi,oi){ answers[qi]=oi; renderMap(); }
function buildMap(){
  if(answers.some(a=>a===null)){ toast(C().answerAll,false); return; }
  const t=answers[0],h=answers[1],n=answers[2],cc=Math.round((answers[3]+answers[4])/2),r=answers[5];
  const mom=Math.round(((t+h+n+cc)/8)*80+(r/2)*20);
  const layers={t:t,h:h,n:n,c:cc};
  const leak=Object.keys(layers).reduce((a,b)=>layers[a]<=layers[b]?a:b);
  localStorage.setItem("map_"+memberId, JSON.stringify({t,h,n,c:cc,mom,leak}));
  confetti(18); renderMap(); renderHome();
}
function retakeMap(){ localStorage.removeItem("map_"+memberId); answers=[null,null,null,null,null,null]; renderMap(); }
function sendMapToCoach(){
  const sm=savedMap(); if(!sm) return;
  mode="xray"; renderModes(); showView("chat");
  const q=document.getElementById("qwrap"); if(q) q.remove();
  document.getElementById("input").value="BUSINESS MAP RESULT - Momentum "+sm.mom+"/100 | Traffic "+sm.t+"/2 | Hub "+sm.h+"/2 | Nurture "+sm.n+"/2 | Conversion "+sm.c+"/2 | Biggest leak: "+leakName(sm.leak)+". Use this as my full picture and start coaching from the leak. Update my memory with these scores.";
  send();
}
function renderMap(){
  const c=C(); const sm=savedMap(); let h='<div class="mapwrap"><div class="eyebrow"><i></i>02 · BUSINESS MAP</div><h1 style="font-size:24px">'+c.mapTitle+'</h1><p class="hsub">'+c.mapSub+'</p>';
  if(!sm){
    QUIZ.forEach((q,qi)=>{ h+='<div class="card" style="margin-bottom:10px;padding:16px 20px"><b style="font-size:13px;color:var(--text-primary)"><span class="mono" style="color:var(--text-muted)">0'+(qi+1)+'</span> '+(lang==="ar"?q.ar:q.en)+'</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'; q.opts.forEach((o,oi)=>{ h+='<button class="opt'+(answers[qi]===oi?" on":"")+'" onclick="ans('+qi+','+oi+')">'+(lang==="ar"?o[1]:o[0])+'</button>'; }); h+='</div></div>'; });
    const complete = answers.every(a=>a!==null);
    h+='<button class="btn-gold" '+(complete?'':'disabled title="'+c.answerAll+'"')+' onclick="buildMap()">'+c.buildMap+'</button>';
  } else {
    const W=[22,55,95]; const col=s=>["var(--error)","var(--warning)","var(--success)"][s];
    h+='<div class="grid2"><div class="card" style="display:flex;align-items:center;justify-content:center"><div style="position:relative"><svg width="140" height="140"><circle cx="70" cy="70" r="58" class="ringbg"/><circle cx="70" cy="70" r="58" class="ringfg" id="ring" style="stroke-dasharray:364.4;stroke-dashoffset:364.4"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="mono" style="font-size:28px;font-weight:700;color:var(--gold)">'+sm.mom+'</span><span class="mono" style="font-size:10px;color:var(--text-muted)">/100</span></div></div></div><div class="card">';
    [[c.lTraffic,sm.t],[c.lHub,sm.h],[c.lNurture,sm.n],[c.lConversion,sm.c]].forEach(x=>{ h+='<div class="mrow"><div class="mt"><span>'+x[0]+'</span><span class="mono">'+x[1]+'/2</span></div><div class="mtrack"><div class="mfill" data-w="'+W[x[1]]+'" style="background:'+col(x[1])+'"></div></div></div>'; });
    h+='</div></div><div class="leak">◆ '+c.bigLeak+': <b>'+leakName(sm.leak)+'</b> — '+(lang==="ar"?"ابدأ الإصلاح من هنا.":"start fixing here.")+'</div><div style="display:flex;gap:10px"><button class="btn-ghost" onclick="retakeMap()">'+c.retake+'</button><button class="btn-gold" onclick="sendMapToCoach()">'+c.sendCoach+'</button></div>';
  }
  h+='</div>';
  document.getElementById("mapView").innerHTML=h;
  if(sm) requestAnimationFrame(()=>{ setTimeout(()=>{ document.querySelectorAll(".mfill").forEach(b=>{ if(b.dataset.w) b.style.width=b.dataset.w+"%"; }); const r=document.getElementById("ring"); if(r) r.style.strokeDashoffset=(364.4*(1-sm.mom/100)).toFixed(1); },80); });
}
/* ---------- CHAT ---------- */
function renderModes(){
  const box=document.getElementById("modes"); box.innerHTML="";
  MODES.forEach((m,i)=>{ const locked=RANK[tier]<RANK[m.tier];
    const b=document.createElement("button"); b.className="mchip"+(m.id===mode?" on":"");
    b.innerHTML='<span class="mi">0'+(i+1)+'</span>'+T(m,"t")+(locked?' <span class="pill warn">'+m.tier.toUpperCase()+'</span>':'');
    b.onclick=()=>{ if(locked){ showView("chat"); addMsg("Locked: "+T(m,"t")+" is a "+m.tier.toUpperCase()+" tier mode. Paste your Whop license key to unlock.","ai"); return; } mode=m.id; renderModes(); addMsg((lang==="ar"?"تم التبديل إلى ":"Switched to ")+T(m,"t")+".","ai"); };
    box.appendChild(b); });
  const tb=document.getElementById("tierBadge"); if(tb) tb.textContent=tier.toUpperCase();
  const mb=document.getElementById("memBadge"); if(mb) mb.textContent="MEM "+memberId.slice(2,6).toUpperCase();
}
function renderChatEmpty(){
  const c=document.getElementById("chat");
  const old=document.getElementById("qwrap"); if(old) old.remove();
  if(history.length>0) return;
  const chips=[["xray","Audit My Business","Run my Business X-Ray. Interview me one question at a time, then give me my audit and the single first fix."],["community","Build My Community","Help me set up the MVC 6 non-negotiables for my group. Ask me what I have first."],["dm","Write Converting DMs","Teach me the Hand-Raiser flow and write my first DM script for my niche."],["offer","Build My Offer","Interview me and build my 14-block Offer Doc, one section at a time."]];
  const w=document.createElement("div"); w.id="qwrap"; w.style.cssText="display:flex;gap:8px;flex-wrap:wrap;";
  chips.forEach(ch=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=ch[1];
    b.onclick=()=>{ w.remove(); if(RANK[tier]<RANK[modeTier(ch[0])]){ addMsg("Locked: "+ch[1]+" is a "+modeTier(ch[0]).toUpperCase()+" tier mode. Paste your Whop license key to unlock.","ai"); unlockPrompt(); return; } mode=ch[0]; renderModes(); document.getElementById("input").value=ch[2]; send(); };
    w.appendChild(b); });
  c.appendChild(w);
}
function fmt(text){
  let s=text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s=s.replace(/```([\s\S]*?)```/g,function(m,c){return "<pre>"+c+"</pre>";});
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/^###?\s?(.+)$/gm,"<span class='h'>$1</span>");
  s=s.replace(/^[-*]\s+(.+)$/gm,"<span class='li'>• $1</span>");
  return s;
}
function showTyping(){ const c=document.getElementById("chat"); const d=document.createElement("div"); d.className="typing"; d.id="typing"; d.innerHTML="<span></span><span></span><span></span>"; c.appendChild(d); c.scrollTop=c.scrollHeight; }
function hideTyping(){ const t=document.getElementById("typing"); if(t) t.remove(); }
function addMsg(text,who){
  const c=document.getElementById("chat"); const d=document.createElement("div"); d.className="msg "+who;
  const s=document.createElement("span"); if(who==="ai") s.innerHTML=fmt(text); else s.textContent=text; d.appendChild(s);
  if(who==="ai"){ const b=document.createElement("button"); b.className="speak"; b.textContent="▶ VOX"; b.setAttribute("aria-label","Play voice"); b.onclick=()=>speak(text); d.appendChild(b); }
  c.appendChild(d); c.scrollTop=c.scrollHeight;
}
function speak(text){
  fetch(API_URL+"/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:text.slice(0,600)})})
  .then(r=>{ if(!r.ok) throw new Error("TTS "+r.status); return r.blob(); })
  .then(b=>{ const a=new Audio(URL.createObjectURL(b)); a.play(); })
  .catch(e=>addMsg("Voice failed: "+e.message+". Retry.","ai"));
}
function exportChat(){
  const lines=[]; document.querySelectorAll("#chat .msg").forEach(m=>{ lines.push((m.classList.contains("user")?"YOU:\n":"COACH:\n")+m.querySelector("span").textContent); });
  const b=new Blob([lines.join("\n\n")],{type:"text/plain"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="income-engine-session.txt"; a.click();
}
async function send(){
  const inp=document.getElementById("input"); const text=inp.value.trim(); if(!text) return;
  const q=document.getElementById("qwrap"); if(q) q.remove();
  addMsg(text,"user"); history.push({role:"user",content:text}); inp.value=""; showTyping();
  const wire=(lang==="ar")?("[Respond fully in Arabic] "+text):text;
  try{
    const r=await fetch(API_URL+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:wire,history:history.slice(-16),mode:mode,member_id:memberId})});
    hideTyping();
    if(r.status===403){ addMsg("Locked for your tier. Unlock with your Whop license key.","ai"); return; }
    const d=await r.json(); const reply=d.reply||d.response||d.message||"Error.";
    addMsg(reply,"ai"); history.push({role:"assistant",content:reply}); updateDoneBar();
  }catch(e){ hideTyping(); addMsg("Connection error: "+e.message+". Retry.","ai"); }
}
async function unlock(){
  const key=document.getElementById("lic").value.trim(); if(!key) return;
  try{
    const r=await fetch(API_URL+"/api/unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({member_id:memberId,license_key:key})});
    const d=await r.json(); if(!r.ok) throw new Error(d.detail||"invalid license");
    tier=d.tier; localStorage.setItem("tier",tier); renderModes(); renderHome();
    toast("Unlocked: "+tier.toUpperCase()+" plan",true);
    addMsg("Unlocked: "+tier.toUpperCase()+" plan. All "+tier+" modes are open.","ai");
  }catch(e){ toast("Unlock failed: "+e.message,false); addMsg("Unlock failed: "+e.message,"ai"); }
}
function unlockPrompt(){ const k=prompt("Paste your Whop license key:"); if(k){ const i=document.getElementById("lic"); if(i){ i.value=k; unlock(); } else { showView("home"); setTimeout(()=>{ const j=document.getElementById("lic"); if(j){ j.value=k; unlock(); } },100); } } }
async function loadTier(){ try{ const r=await fetch(API_URL+"/api/tier?member_id="+encodeURIComponent(memberId)); const d=await r.json(); if(d.tier){ tier=d.tier; localStorage.setItem("tier",tier);} }catch(e){} renderModes(); }
function toggleH(k){ habit[k]=!habit[k]; renderH(); }
function renderH(){ const a=document.getElementById("hC"),b=document.getElementById("hCom"),c=document.getElementById("hConv"); if(a){a.classList.toggle("on",habit.c);} if(b){b.classList.toggle("on",habit.com);} if(c){c.classList.toggle("on",habit.conv);} }
function dayKey(d){ return d.toISOString().slice(0,10); }
function calcStreak(){ const log=JSON.parse(localStorage.getItem("habit_log")||"{}"); let s=0; const d=new Date(); if(!log[dayKey(d)]) d.setDate(d.getDate()-1); while(log[dayKey(d)]){s++;d.setDate(d.getDate()-1);} return s; }
function renderStreak(){ const el=document.getElementById("streak"); if(el) el.textContent=calcStreak()+"d"; }
function logDay(){
  const log=JSON.parse(localStorage.getItem("habit_log")||"{}"); log[dayKey(new Date())]={c:habit.c,com:habit.com,conv:habit.conv}; localStorage.setItem("habit_log",JSON.stringify(log));
  const s=calcStreak();
  const msg="DAILY CHECK-IN - Content: "+(habit.c?"YES":"NO")+" | Community: "+(habit.com?"YES":"NO")+" | Conversations: "+(habit.conv?"YES":"NO")+" | Streak: "+s+" days. Act as my accountability coach: celebrate what I did, call out what I skipped with empathy, and give me ONE focus for tomorrow. Update my memory with this check-in and streak.";
  habit={c:false,com:false,conv:false}; renderH(); showView("chat");
  const q=document.getElementById("qwrap"); if(q) q.remove();
  document.getElementById("input").value=msg; send();
}
function clearChat(){
  const n=document.querySelectorAll("#chat .msg").length;
  if(!confirm("Clear this session? "+n+" messages will be removed.")) return;
  history=[]; document.getElementById("chat").innerHTML=""; addMsg(lang==="ar"?"تم المسح. على ماذا نعمل؟":"Chat cleared. What are we working on?","ai"); renderChatEmpty();
}
/* ---------- TOUR ---------- */

 {view:"home", sel:"#homeView", en:"Mission Control: your journey, momentum and critical path. Numbers first, prose second.", ar:"غرفة القيادة: رحلتك وزخمك ومسارك الحرج. الأرقام أولاً."},
 {view:"home", sel:"#pulseCard", en:"Daily Pulse: log the 90-minute rhythm and grow your streak.", ar:"النبض اليومي: سجّل روتين 90 دقيقة ونمِّ سلسلتك."},
 {view:"home", sel:"#planCard", en:"Plan & unlock: Free → Insider → Partner.", ar:"الخطة والفتح: مجاني → إنسايدر → بارتنر."},
 {view:"map", sel:"#mapView", en:"The Business Map renders your funnel as live meters before you ever type.", ar:"خريطة العمل ترسم قمعك كمقاييس حية قبل أن تكتب."},
 {view:"chat", sel:"#modes", en:"Operating modes. LOCK pills open with your Whop plan.", ar:"الأوضاع. شارات LOCK تُفتح بخطتك."},
 {view:"chat", sel:"#chatfoot", en:"The Coach answers with typing dots, rich text and voice playback. Press ⌘K anywhere for the command palette.", ar:"المدرب يجيب مع نقاط كتابة ونص منسق وتشغيل صوتي. اضغط ⌘K في أي مكان للوحة الأوامر."},
];
let tourI=0;
function showTour(){
  document.querySelectorAll(".tour-hl").forEach(e=>e.classList.remove("tour-hl"));
  if(tourI>=TOUR.length){ endTour(); return; }
  const s=TOUR[tourI];
  showView(s.view);
  setTimeout(()=>{ const el=document.querySelector(s.sel); if(el){ el.classList.add("tour-hl"); el.scrollIntoView({block:"center",behavior:"smooth"}); } },80);
  document.getElementById("tourCard").style.display="block";
  document.getElementById("tourTxt").textContent=(lang==="ar")?s.ar:s.en;
  document.getElementById("tourStep").textContent=(tourI+1)+"/"+TOUR.length;
}
function nextTour(){ tourI++; showTour(); }
function endTour(){ localStorage.setItem("tour_"+memberId,"1"); document.getElementById("tourCard").style.display="none"; document.querySelectorAll(".tour-hl").forEach(e=>e.classList.remove("tour-hl")); }
/* ---------- GLOBAL KEYS ---------- */
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openPal(); return; }
  if(document.getElementById("pal").style.display==="block"){
    const v=document.getElementById("palIn").value;
    if(e.key==="Escape") closePal();
    else if(e.key==="ArrowDown"){ e.preventDefault(); palSel=Math.min(palSel+1,Math.max(palFiltered.length-1,0)); renderPal(v); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); palSel=Math.max(palSel-1,0); renderPal(v); }
    else if(e.key==="Enter"){ e.preventDefault(); palRun(palSel); }
  }
});
/* ---------- INIT ---------- */
loadTier(); applyLang(); showView("home");
if(!localStorage.getItem("tour_"+memberId)) setTimeout(()=>{tourI=0;showTour();},800);
addMsg(C().welcome,"ai"); renderChatEmpty();
</script>
